<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm-GIS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      width: 350px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #16855b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #126d4a;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Farm-GIS</h1>

    <label>メールアドレス</label>
    <input type="email" id="email" placeholder="メールアドレス">

    <label>パスワード</label>
    <input type="password" id="password" placeholder="パスワード">

    <button onclick="login()">ログイン</button>

    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgrwnbezqnhrplbxvxlq.supabase.co";

    const SUPABASE_KEY = "sb_publishable_wyPY_F27gjjz7XZCM4i4Ig_oFzBXmpu";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "ログインしています...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = "ログインできませんでした：" + error.message;
        return;
      }

      window.location.href =
  "https://experience.arcgis.com/experience/4f8749f651b04ebf9f260d46ddad6aa8";
    }
  </script>

</body>
</html>
